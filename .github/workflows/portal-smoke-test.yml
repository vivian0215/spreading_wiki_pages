name: Portal smoke test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "fix/**" ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run portal smoke test
        run: bash tests/smoke-test.sh
